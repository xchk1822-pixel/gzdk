<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>中国年餐厅薪资管理系统 - 云端同步版</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f0f2f5; color: #333; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 1100px; margin: auto; }
        .header-box { text-align: center; border-bottom: 3px double #b71c1c; margin-bottom: 25px; padding-bottom: 10px; }
        .header-box h1 { margin: 0; color: #b71c1c; font-size: 26px; }
        .header-box p { margin: 5px 0; color: #666; font-weight: bold; }
        .btn-group { text-align: right; margin-bottom: 20px; }
        .btn { padding: 8px 12px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; font-size: 11px; margin-left: 5px; }
        .btn-unlock { background: #455a64; color: white; }
        .btn-add { background: #2e7d32; color: white; }
        .btn-backup { background: #fb8c00; color: white; }
        .btn-restore { background: #8e24aa; color: white; }
        .btn-print { background: #1565c0; color: white; }
        .btn-danger { background: #d32f2f; color: white; }
        .btn-cloud-up { background: #b71c1c !important; color: white; border: 2px solid #ffcdd2; }
        .btn-cloud-down { background: #1565c0 !important; color: white; border: 2px solid #bbdefb; }
        .sync-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-right: 10px;
            background: #e0e0e0;
        }
        .sync-status.online { background: #c8e6c9; color: #2e7d32; }
        .sync-status.offline { background: #ffcdd2; color: #c62828; }
        .sync-status.syncing { background: #fff9c4; color: #f57f17; }

        .row-normal { background-color: #ffffff; }
        .row-empty { background-color: #fff3e0 !important; } 
        .row-off { background-color: #e3f2fd !important; }    
        .row-absent { background-color: #ffebee !important; }  
        .lock-status { font-size: 12px; margin-right: 10px; font-weight: bold; }
        .status-locked { color: #c62828; }
        .status-unlocked { color: #2e7d32; }
        #passwordModal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); align-items: center; justify-content: center;
        }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 320px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-content input { width: 80%; padding: 10px; margin: 15px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 20px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; font-size: 12px; table-layout: fixed; }
        th, td { border: 1px solid #dee2e6; padding: 8px 2px; text-align: center; overflow: hidden; }
        th { background-color: #f8f9fa; color: #555; font-size: 11px; height: 40px; }
        .individual-config { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; background: #e8f5e9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #c8e6c9; }
        .config-item { display: flex; flex-direction: column; font-size: 11px; font-weight: bold; }
        .config-item label { color: #2e7d32; margin-bottom: 4px; }
        .btn-punch { padding: 4px 8px; font-size: 10px; cursor: pointer; background: #b71c1c; color: white; border: none; border-radius: 4px; margin-top: 2px; }
        .btn-punch:disabled { background: #ccc !important; cursor: not-allowed; opacity: 0.6; }
        input[type="checkbox"]:disabled { cursor: not-allowed; opacity: 0.8; }
        input[readonly] { background-color: #f9f9f9; border: 1px solid #ddd; color: #333; text-align: center; width: 45px; font-weight: bold; }
        .emp-stat-box { margin-top: 15px; padding: 15px; background: #fdfdfd; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; border-radius: 6px; }
        .signature-row { margin-top: 30px; display: flex; justify-content: flex-end; }
        .signature-line { border-top: 1.5px solid #333; width: 220px; text-align: center; font-size: 11px; font-weight: bold; padding-top: 5px; }
        .summary-area { margin-top: 50px; page-break-before: always; border-top: 3px solid #b71c1c; padding-top: 20px; }
        @media print {
            .no-print, .btn-punch, #passwordModal { display: none !important; }
            .page-break { page-break-after: always; border-bottom: 1px dashed #ccc; margin-bottom: 30px; }
            .container { box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

<div id="passwordModal">
    <div class="modal-content">
        <h3 style="margin:0">认证 / Autenticación</h3>
        <p style="font-size:11px; color:#666;">请输入管理密码 / Contraseña</p>
        <input type="password" id="adminPassInput" placeholder="******" onkeydown="if(event.keyCode==13) verifyPassword()">
        <div style="display:flex; justify-content: space-around;">
            <button class="btn btn-danger" onclick="closeModal()">取消 / Cancelar</button>
            <button class="btn btn-add" onclick="verifyPassword()">确认 / OK</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="header-box">
        <h1>中国年餐厅薪资管理系统</h1>
        <p>Sistema de Nómina - Restaurante China Yearly</p>
    </div>

    <div class="btn-group no-print">
        <span id="syncStatus" class="sync-status offline">⏳ 同步中...</span>
        <span id="lockStatusDisplay" class="lock-status status-locked">🔒 已锁定 / Bloqueado</span>
        <button id="unlockBtn" class="btn btn-unlock" onclick="openModal()">🔑 管理员解锁 / Desbloquear</button>
        <button class="btn btn-add" onclick="addEmployee()">+ 添加员工 / Agregar</button>
        
        <button class="btn btn-cloud-up" onclick="pushToCloud()">📤 手动上传</button>
        <button class="btn btn-cloud-down" onclick="pullFromCloud()">📥 手动下载</button>

        <button class="btn btn-backup" onclick="exportData()">💾 手动备份 / Exportar</button>
        <button class="btn btn-restore" onclick="triggerRestore()">📂 恢复文件 / Importar</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(this)">
        <button class="btn btn-print" onclick="window.print()">🖨️ 打印工资单 / Imprimir</button>
        <button class="btn btn-danger" onclick="clearAllData()">⚠️ 清空全部 / Limpiar</button>
    </div>

    <div id="employees-content"></div>

    <div class="summary-area">
        <h2 style="border-left: 5px solid #b71c1c; padding-left:10px;">全员汇总表 / Resumen General</h2>
        <table>
            <thead>
                <tr style="background:#333; color:white;">
                    <th style="width:15%">姓名 / Nombre</th>
                    <th style="width:20%">出勤天数 / Días (T/L/A)</th>
                    <th style="width:15%">基本工资 / Base</th>
                    <th style="width:15%">加班费 / Extras</th>
                    <th style="width:15%">福利 / Bonos</th>
                    <th style="width:20%">总计合计 / Total</th>
                </tr>
            </thead>
            <tbody id="summary-body"></tbody>
            <tfoot>
                <tr style="background:#fff9c4; font-weight:bold; font-size: 14px;">
                    <td colspan="2" style="text-align: right;">全店合计 / GRAN TOTAL:</td>
                    <td id="total-base">C$ 0.00</td><td id="total-extras">C$ 0.00</td><td id="total-bonos">C$ 0.00</td><td id="total-all" style="color:#b71c1c;">C$ 0.00</td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<script>
    // ==================== 配置 ====================
    const FB_URL = "https://restaurant-cw-default-rtdb.firebaseio.com/salary_db.json";
    const ADMIN_PASSWORD = "123456";
    const DB_NAME = 'rest_salary_complete_v6';
    const BACKUP_NAME = 'rest_salary_backup';
    
    // ==================== 全局变量 ====================
    let isUnlocked = false;
    let employees = [];
    let deviceId = 'device_' + Math.random().toString(36).substr(2, 9);
    let syncInProgress = false;
    let lastSyncTime = 0;

    // ==================== 同步状态显示 ====================
    function updateSyncStatus(status, message) {
        const statusEl = document.getElementById('syncStatus');
        statusEl.className = 'sync-status ' + status;
        if (status === 'online') statusEl.innerHTML = '✅ 云端在线';
        else if (status === 'offline') statusEl.innerHTML = '❌ 云端离线';
        else if (status === 'syncing') statusEl.innerHTML = '🔄 同步中...';
    }

    // ==================== 数据持久化 ====================
    function loadData() {
        const mainData = localStorage.getItem(DB_NAME);
        const backupData = localStorage.getItem(BACKUP_NAME);
        
        if (mainData) {
            try {
                employees = JSON.parse(mainData);
            } catch(e) {
                employees = [];
            }
        } else if (backupData) {
            if (confirm("⚠️ 检测到主数据丢失，是否从自动备份中恢复？")) {
                try {
                    employees = JSON.parse(backupData);
                    saveData(true);
                } catch(e) {
                    employees = [];
                }
            }
        } else {
            employees = [];
        }
        
        // 确保有时间戳
        if (!localStorage.getItem(DB_NAME + '_timestamp')) {
            localStorage.setItem(DB_NAME + '_timestamp', Date.now().toString());
        }
    }

    function saveData(silent = false) {
        if (!employees) return;
        
        const dataStr = JSON.stringify(employees);
        localStorage.setItem(DB_NAME, dataStr);
        
        if (employees.length > 0) {
            localStorage.setItem(BACKUP_NAME, dataStr);
        }
        
        // 更新时间戳
        localStorage.setItem(DB_NAME + '_timestamp', Date.now().toString());
        
        // 非静默模式且不是由同步触发的，才触发自动上传
        if (!silent) {
            clearTimeout(window.autoPushTimer);
            window.autoPushTimer = setTimeout(() => {
                pushToCloud(true);
            }, 3000);
        }
    }

    // ==================== 双向同步核心 ====================
    
    // 上传到云端
    function pushToCloud(silent = false) {
        if (!employees || employees.length === 0) {
            if (!silent) alert("没有数据可上传");
            return Promise.reject("无数据");
        }
        
        updateSyncStatus('syncing', '同步中...');
        
        const timestamp = Date.now();
        localStorage.setItem(DB_NAME + '_timestamp', timestamp.toString());
        
        const dataWithMeta = {
            data: employees,
            timestamp: new Date(timestamp).toISOString(),
            device: deviceId
        };
        
        return fetch(FB_URL, { 
            method: 'PUT', 
            body: JSON.stringify(dataWithMeta),
            headers: { 'Content-Type': 'application/json' }
        })
        .then(res => {
            if(res.ok) {
                updateSyncStatus('online', '云端在线');
                if (!silent) alert("✅ 已成功上传至云端！");
                lastSyncTime = Date.now();
                return true;
            }
            throw new Error("上传失败");
        })
        .catch(err => {
            updateSyncStatus('offline', '云端离线');
            if (!silent) alert("❌ 上传失败，请检查网络");
            return false;
        });
    }

    // 从云端下载
    function pullFromCloud(silent = false) {
        updateSyncStatus('syncing', '同步中...');
        
        return fetch(FB_URL + '?t=' + Date.now())
            .then(res => res.json())
            .then(dataWithMeta => {
                if (!dataWithMeta) {
                    updateSyncStatus('offline', '云端离线');
                    if (!silent) alert("❌ 云端暂无备份数据");
                    return false;
                }
                
                let cloudEmployees = [];
                let cloudTimestamp = 0;
                
                if (dataWithMeta.data) {
                    cloudEmployees = dataWithMeta.data;
                    cloudTimestamp = new Date(dataWithMeta.timestamp).getTime();
                } else {
                    cloudEmployees = dataWithMeta;
                    cloudTimestamp = Date.now();
                }
                
                if (!cloudEmployees || cloudEmployees.length === 0) {
                    updateSyncStatus('online', '云端在线');
                    if (!silent) alert("❌ 云端数据为空");
                    return false;
                }
                
                // 保存云端时间戳
                localStorage.setItem(DB_NAME + '_timestamp', cloudTimestamp.toString());
                
                employees = JSON.parse(JSON.stringify(cloudEmployees));
                saveData(true);
                render();
                
                updateSyncStatus('online', '云端在线');
                lastSyncTime = Date.now();
                
                if (!silent) {
                    alert(`✅ 云端数据已同步！\n更新时间: ${new Date(cloudTimestamp).toLocaleString()}`);
                }
                
                return true;
            })
            .catch(err => {
                updateSyncStatus('offline', '云端离线');
                if (!silent) alert("❌ 下载失败，请检查网络");
                return false;
            });
    }

    // 检查并同步（自动同步核心）
    function checkAndSync() {
        if (syncInProgress) return;
        
        syncInProgress = true;
        
        fetch(FB_URL + '?nocache=' + Date.now())
            .then(res => res.json())
            .then(cloudData => {
                if (!cloudData) {
                    // 云端无数据，推送本地
                    if (employees && employees.length > 0) {
                        return pushToCloud(true);
                    }
                    return;
                }
                
                // 解析云端数据
                let cloudEmployees = [];
                let cloudTimestamp = 0;
                let cloudDevice = '';
                
                if (cloudData.data) {
                    cloudEmployees = cloudData.data;
                    cloudTimestamp = new Date(cloudData.timestamp).getTime();
                    cloudDevice = cloudData.device || 'unknown';
                } else {
                    cloudEmployees = cloudData;
                    cloudTimestamp = 0;
                }
                
                // 获取本地最后修改时间
                const localTimestamp = parseInt(localStorage.getItem(DB_NAME + '_timestamp') || '0');
                const localDataStr = JSON.stringify(employees);
                const cloudDataStr = JSON.stringify(cloudEmployees);
                
                // 如果数据相同，不需要同步
                if (localDataStr === cloudDataStr) {
                    updateSyncStatus('online', '云端在线');
                    syncInProgress = false;
                    return;
                }
                
                // 决定同步方向
                if (cloudTimestamp > localTimestamp && cloudDevice !== deviceId) {
                    // 云端更新，且不是本机上传的
                    console.log("检测到云端新数据，来自:", cloudDevice);
                    if (confirm(`🔄 检测到另一台电脑有更新，是否同步？`)) {
                        employees = JSON.parse(JSON.stringify(cloudEmployees));
                        saveData(true);
                        render();
                        alert("✅ 同步完成！");
                    }
                } else if (localTimestamp > cloudTimestamp && employees.length > 0) {
                    // 本地更新，推送到云端
                    console.log("本地数据更新，推送到云端");
                    pushToCloud(true);
                } else if (localTimestamp === 0 && employees.length === 0 && cloudEmployees.length > 0) {
                    // 本地为空，从云端拉取
                    console.log("本地无数据，从云端拉取");
                    employees = JSON.parse(JSON.stringify(cloudEmployees));
                    saveData(true);
                    render();
                }
                
                updateSyncStatus('online', '云端在线');
                syncInProgress = false;
            })
            .catch(err => {
                console.log("同步检查失败:", err);
                updateSyncStatus('offline', '云端离线');
                syncInProgress = false;
            });
    }

    // 启动自动同步
    function startAutoSync() {
        console.log("自动同步已启动，设备ID:", deviceId);
        
        // 首次连接时检查云端
        setTimeout(() => {
            checkAndSync();
        }, 2000);
        
        // 每8秒检查一次
        setInterval(() => {
            checkAndSync();
        }, 8000);
        
        // 页面可见时立即检查
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                checkAndSync();
            }
        });
        
        // 网络恢复时检查
        window.addEventListener('online', () => {
            console.log("网络已恢复，开始同步");
            checkAndSync();
        });
    }

    // ==================== 原有功能（保持不变）====================
    function openModal() {
        if (isUnlocked) { 
            isUnlocked = false; 
            updateLockUI(); 
            alert("已退出管理模式 / Modo Admin Cerrado"); 
            render(); 
        } else { 
            document.getElementById('passwordModal').style.display = 'flex'; 
            document.getElementById('adminPassInput').focus(); 
        }
    }
    
    function closeModal() { 
        document.getElementById('passwordModal').style.display = 'none'; 
    }
    
    function verifyPassword() {
        if (document.getElementById('adminPassInput').value === ADMIN_PASSWORD) { 
            isUnlocked = true; 
            updateLockUI(); 
            closeModal(); 
            render(); 
        } else { 
            alert("密码错误 / Incorrecto"); 
        }
    }
    
    function updateLockUI() {
        const s = document.getElementById('lockStatusDisplay');
        const b = document.getElementById('unlockBtn');
        s.innerHTML = isUnlocked ? "🔓 管理模式 / Modo Admin" : "🔒 已锁定 / Bloqueado";
        s.className = isUnlocked ? "lock-status status-unlocked" : "lock-status status-locked";
        b.innerHTML = isUnlocked ? "🔒 退出管理 / Salir" : "🔑 管理员解锁 / Desbloquear";
    }

    function checkPermission() { 
        if (!isUnlocked) alert("需要管理员权限 / Requiere Admin"); 
        return isUnlocked; 
    }

    function doPunch(empId, dayIdx, field) {
        const emp = employees.find(e => e.id === empId);
        if (!emp.records[dayIdx]) emp.records[dayIdx] = { s:'', e:'', off:false, abs:false, b:0 };
        if (!isUnlocked && emp.records[dayIdx][field]) { 
            alert("不可修改 / No se puede modificar"); 
            return; 
        }
        const now = new Date();
        const t = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        emp.records[dayIdx][field] = t;
        saveData(); 
        render();
    }

    function addEmployee() {
        if (!checkPermission()) return;
        const n = prompt("输入员工姓名 / Nombre:");
        if (n) { 
            employees.push({ 
                id: Date.now(), 
                name: n, 
                startDate: new Date().toISOString().split('T')[0], 
                days: 15, 
                dailyRate: 500, 
                otRate: 60, 
                records: {} 
            }); 
            saveData(); 
            render(); 
        }
    }

    function updateConfig(id, f, v) { 
        if (!isUnlocked) { render(); return; } 
        const emp = employees.find(e => e.id === id); 
        if (emp) { 
            emp[f] = v; 
            saveData(); 
            render(); 
        } 
    }
    
    function updateState(empId, dayIdx, field, val) {
        const emp = employees.find(e => e.id === empId);
        if (!emp.records[dayIdx]) emp.records[dayIdx] = { s:'', e:'', off:false, abs:false, b:0 };
        const r = emp.records[dayIdx];
        if (!isUnlocked) {
            if (field === 'b') { render(); return; }
            if (r[field] === true && val === false) { 
                alert("已锁定 / Bloqueado"); 
                render(); 
                return; 
            }
        }
        if (field === 'off' && val === true) r.abs = false;
        if (field === 'abs' && val === true) r.off = false;
        
        if (field === 'b') {
            r[field] = parseFloat(val) || 0;
        } else {
            r[field] = val;
        }
        
        saveData(); 
        render();
    }

    function calculateHours(s, e) {
        if(!s || !e) return 0;
        let d1 = new Date(`2000-01-01T${s}`), d2 = new Date(`2000-01-01T${e}`);
        if (d2 < d1) d2.setDate(d2.getDate() + 1);
        return (d2 - d1) / 3600000;
    }

    function render() {
        const list = document.getElementById('employees-content');
        list.innerHTML = ""; 
        let gBase=0, gExtras=0, gBonos=0, gAll=0, summaryHtml = "";

        employees.forEach(emp => {
            const sDate = new Date(emp.startDate + "T00:00:00");
            let rowsHtml = "";
            let eBase=0, eExtras=0, eBonos=0, dT=0, dL=0, dA=0;

            for(let d=0; d<emp.days; d++){
                const rec = emp.records[d] || { s:'', e:'', off:false, abs:false, b:0 };
                let cur = new Date(sDate); 
                cur.setDate(sDate.getDate() + d);
                let wh=0, oh=0, pay=0, rowCls="row-normal";

                if (rec.abs) { 
                    rowCls="row-absent"; 
                    dA++; 
                    pay = parseFloat(rec.b || 0); 
                } else if (rec.off) { 
                    rowCls="row-off"; 
                    dL++; 
                    eBase += parseFloat(emp.dailyRate); 
                    pay = parseFloat(emp.dailyRate) + parseFloat(rec.b || 0); 
                } else {
                    dT++; 
                    eBase += parseFloat(emp.dailyRate);
                    if (rec.s && rec.e) { 
                        wh = calculateHours(rec.s, rec.e); 
                        oh = Math.max(0, wh - 9); 
                        eExtras += (oh * parseFloat(emp.otRate)); 
                    } else { 
                        rowCls = "row-empty"; 
                    } 
                    pay = parseFloat(emp.dailyRate) + (oh * parseFloat(emp.otRate)) + parseFloat(rec.b || 0);
                }
                eBonos += parseFloat(rec.b || 0);

                const isOffOrAbs = (rec.off || rec.abs);
                const checkLock = !isUnlocked && (isOffOrAbs || rec.s !== "" || rec.e !== "");
                const sPunchLock = !isUnlocked && (rec.s !== "" || isOffOrAbs);
                const ePunchLock = !isUnlocked && (rec.e !== "" || isOffOrAbs);

                rowsHtml += `<tr class="${rowCls}">
                    <td><b>${cur.getMonth()+1}/${cur.getDate()}</b></td>
                    <td><input type="checkbox" ${rec.off?'checked':''} ${checkLock?'disabled':''} onchange="updateState(${emp.id},${d},'off',this.checked)"> 休/L</td>
                    <td><input type="checkbox" ${rec.abs?'checked':''} ${checkLock?'disabled':''} onchange="updateState(${emp.id},${d},'abs',this.checked)"> 缺/A</td>
                    <td><input type="text" value="${rec.s||''}" readonly style="width:45px"><button class="btn-punch no-print" ${sPunchLock?'disabled':''} onclick="doPunch(${emp.id},${d},'s')">入</button></td>
                    <td><input type="text" value="${rec.e||''}" readonly style="width:45px"><button class="btn-punch no-print" ${ePunchLock?'disabled':''} onclick="doPunch(${emp.id},${d},'e')">出</button></td>
                    <td>${wh.toFixed(1)}h</td><td>${oh.toFixed(1)}h</td>
                    <td><input type="number" value="${rec.b||0}" style="width:50px" ${!isUnlocked?'disabled':''} onchange="updateState(${emp.id},${d},'b',this.value)"></td>
                    <td style="font-weight:bold;">C$ ${pay.toFixed(2)}</td>
                </tr>`;
            }

            const total = eBase + eExtras + eBonos;
            gBase+=eBase; 
            gExtras+=eExtras; 
            gBonos+=eBonos; 
            gAll+=total;

            summaryHtml += `<tr><td><b>${emp.name}</b></td><td>${dT}T / ${dL}L / ${dA}A</td><td>C$ ${eBase.toFixed(2)}</td><td>C$ ${eExtras.toFixed(2)}</td><td>C$ ${eBonos.toFixed(2)}</td><td style="font-weight:bold;">C$ ${total.toFixed(2)}</td></tr>`;

            list.innerHTML += `<div class="page-break">
                <h3 style="color:#1565c0; border-bottom:2px solid #1565c0; margin-top:20px;">${emp.name} - 工资明细 / Recibo de Pago</h3>
                <div class="individual-config no-print">
                    <div class="config-item"><label>开始日期 / Inicio:</label><input type="date" value="${emp.startDate}" ${isUnlocked?'':'readonly'} onchange="updateConfig(${emp.id},'startDate',this.value)"></div>
                    <div class="config-item"><label>结算天数 / Días:</label><input type="number" value="${emp.days}" ${isUnlocked?'':'readonly'} onchange="updateConfig(${emp.id},'days',this.value)"></div>
                    <div class="config-item"><label>日薪 / Salario Diario:</label><input type="number" value="${emp.dailyRate}" ${isUnlocked?'':'readonly'} onchange="updateConfig(${emp.id},'dailyRate',this.value)"></div>
                    <div class="config-item"><label>加班时薪 / Hora Extra:</label><input type="number" value="${emp.otRate}" ${isUnlocked?'':'readonly'} onchange="updateConfig(${emp.id},'otRate',this.value)"></div>
                    <button class="btn btn-danger" onclick="removeEmployee(${emp.id})" style="height:30px; margin-top:15px; display:${isUnlocked?'block':'none'}">删除员工 / Borrar</button>
                </div>
                <table><thead><tr>
                    <th style="width:8%">日期</th><th style="width:6%">休</th><th style="width:6%">缺</th>
                    <th style="width:12%">入</th><th style="width:12%">出</th><th style="width:8%">工时</th>
                    <th style="width:8%">加班</th><th style="width:8%">福利</th><th style="width:12%">小计</th>
                </tr></thead>
                <tbody>${rowsHtml}</tbody></table>
                <div class="emp-stat-box">
                    <div style="font-size:12px; color:#555;">Base: C$ ${eBase.toFixed(2)} | Extras: C$ ${eExtras.toFixed(2)} | Bono: C$ ${eBonos.toFixed(2)}</div>
                    <div style="font-size:18px; color:#b71c1c; font-weight:bold;">TOTAL: C$ ${total.toFixed(2)}</div>
                </div>
                <div class="signature-row"><div class="signature-line">Firma del Empleado (员工签名)</div></div>
            </div>`;
        });
        
        document.getElementById('summary-body').innerHTML = summaryHtml;
        document.getElementById('total-base').innerText = "C$ " + gBase.toFixed(2);
        document.getElementById('total-extras').innerText = "C$ " + gExtras.toFixed(2);
        document.getElementById('total-bonos').innerText = "C$ " + gBonos.toFixed(2);
        document.getElementById('total-all').innerText = "C$ " + gAll.toFixed(2);
    }

    function removeEmployee(id) { 
        if (checkPermission() && confirm("确定删除？")) { 
            employees = employees.filter(e => e.id !== id); 
            saveData(); 
            render(); 
        } 
    }
    
    function clearAllData() { 
        if (checkPermission() && confirm("⚠️ 确定清空所有数据？这将同时清除备份！")) { 
            employees = []; 
            localStorage.removeItem(DB_NAME);
            localStorage.removeItem(BACKUP_NAME);
            localStorage.removeItem(DB_NAME + '_timestamp');
            render(); 
        } 
    }

    function exportData() {
        if (employees.length === 0) { 
            alert("没有数据可以备份 / No hay datos"); 
            return; 
        }
        const d = JSON.stringify(employees);
        const b = new Blob([d], {type: "application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = `Nomina_ChinaYearly_BACKUP_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
    }

    function triggerRestore() { 
        if(checkPermission()) document.getElementById('importFile').click(); 
    }
    
    function importData(i) {
        const r = new FileReader();
        r.onload = (e) => { 
            try { 
                const temp = JSON.parse(e.target.result); 
                if (Array.isArray(temp)) {
                    employees = temp;
                    saveData(); 
                    render(); 
                    alert("恢复成功 / Restaurado"); 
                } else {
                    throw new Error();
                }
            } catch(err) { 
                alert("文件格式不正确 / Formato de archivo inválido"); 
            } 
        };
        r.readAsText(i.files[0]);
    }

    // ==================== 初始化 ====================
    window.onload = function() {
        loadData();
        render();
        startAutoSync();
        // 测试网络连接
        fetch(FB_URL, { method: 'HEAD' })
            .then(() => updateSyncStatus('online', '云端在线'))
            .catch(() => updateSyncStatus('offline', '云端离线'));
    };
</script>
</body>
</html>
