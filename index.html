<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>中国年餐厅薪资管理系统 - 云端完整版</title>
    <style>
        /* 保持你所有的样式，绝不改动 */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f0f2f5; color: #333; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 1100px; margin: auto; }
        .header-box { text-align: center; border-bottom: 3px double #b71c1c; margin-bottom: 25px; padding-bottom: 10px; }
        .header-box h1 { margin: 0; color: #b71c1c; font-size: 26px; }
        .header-box p { margin: 5px 0; color: #666; font-weight: bold; }
        .btn-group { text-align: right; margin-bottom: 20px; }
        .btn { padding: 8px 12px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; font-size: 11px; margin-left: 5px; }
        .btn-unlock { background: #455a64; color: white; }
        .btn-add { background: #2e7d32; color: white; }
        .btn-backup { background: #fb8c00; color: white; }
        .btn-restore { background: #8e24aa; color: white; }
        .btn-print { background: #1565c0; color: white; }
        .btn-danger { background: #d32f2f; color: white; }
        
        /* 云端同步专用按钮颜色 */
        .btn-push { background: #b71c1c !important; color: white; border: 2px solid #ffcdd2; }
        .btn-pull { background: #1565c0 !important; color: white; border: 2px solid #bbdefb; }

        .row-normal { background-color: #ffffff; }
        .row-empty { background-color: #fff3e0 !important; } 
        .row-off { background-color: #e3f2fd !important; }    
        .row-absent { background-color: #ffebee !important; }  
        .lock-status { font-size: 12px; margin-right: 10px; font-weight: bold; }
        .status-locked { color: #c62828; }
        .status-unlocked { color: #2e7d32; }
        #passwordModal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 320px; text-align: center; }
        .modal-content input { width: 80%; padding: 10px; margin: 15px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 20px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; font-size: 12px; table-layout: fixed; }
        th, td { border: 1px solid #dee2e6; padding: 8px 2px; text-align: center; overflow: hidden; }
        th { background-color: #f8f9fa; color: #555; font-size: 11px; height: 40px; }
        .individual-config { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; background: #e8f5e9; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .config-item { display: flex; flex-direction: column; font-size: 11px; font-weight: bold; }
        .btn-punch { padding: 4px 8px; font-size: 10px; cursor: pointer; background: #b71c1c; color: white; border: none; border-radius: 4px; }
        .btn-punch:disabled { background: #ccc !important; cursor: not-allowed; }
        .emp-stat-box { margin-top: 15px; padding: 15px; background: #fdfdfd; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; border-radius: 6px; }
        .signature-row { margin-top: 30px; display: flex; justify-content: flex-end; }
        .signature-line { border-top: 1.5px solid #333; width: 220px; text-align: center; font-size: 11px; font-weight: bold; padding-top: 5px; }
        .summary-area { margin-top: 50px; page-break-before: always; border-top: 3px solid #b71c1c; padding-top: 20px; }
        @media print { .no-print, .btn-punch, #passwordModal { display: none !important; } .page-break { page-break-after: always; } }
    </style>
</head>
<body>

<div id="passwordModal">
    <div class="modal-content">
        <h3 style="margin:0">认证 / Autenticación</h3>
        <p style="font-size:11px; color:#666;">管理密码</p>
        <input type="password" id="adminPassInput" placeholder="******" onkeydown="if(event.keyCode==13) verifyPassword()">
        <div style="display:flex; justify-content: space-around;">
            <button class="btn btn-danger" onclick="closeModal()">取消</button>
            <button class="btn btn-add" onclick="verifyPassword()">确认</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="header-box">
        <h1>中国年餐厅薪资管理系统</h1>
        <p>Sistema de Nómina - Restaurante China Yearly</p>
    </div>

    <div class="btn-group no-print">
        <span id="lockStatusDisplay" class="lock-status status-locked">🔒 已锁定</span>
        <button id="unlockBtn" class="btn btn-unlock" onclick="openModal()">🔑 解锁</button>
        <button class="btn btn-add" onclick="addEmployee()">+ 添加员工</button>
        
        <button class="btn btn-push" onclick="pushToCloud()">📤 上传到云端</button>
        <button class="btn btn-pull" onclick="pullFromCloud()">📥 下载到本地</button>

        <button class="btn btn-print" onclick="window.print()">🖨️ 打印</button>
        <button class="btn btn-danger" onclick="clearAllData()">⚠️ 清空</button>
    </div>

    <div id="employees-content"></div>

    <div class="summary-area">
        <h2 style="border-left: 5px solid #b71c1c; padding-left:10px;">全员汇总表 / Resumen General</h2>
        <table>
            <thead>
                <tr style="background:#333; color:white;">
                    <th style="width:15%">姓名</th><th style="width:20%">天数 (T/L/A)</th><th style="width:15%">基本</th><th style="width:15%">加班</th><th style="width:15%">福利</th><th style="width:20%">总计</th>
                </tr>
            </thead>
            <tbody id="summary-body"></tbody>
            <tfoot>
                <tr style="background:#fff9c4; font-weight:bold; font-size: 14px;">
                    <td colspan="2" style="text-align: right;">GRAN TOTAL:</td>
                    <td id="total-base"></td><td id="total-extras"></td><td id="total-bonos"></td><td id="total-all" style="color:#b71c1c;"></td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = "123456"; 
    const DB_NAME = 'rest_salary_complete_v6';
    const FB_URL = "https://restaurant-cw-default-rtdb.firebaseio.com/salary_db.json";
    let isUnlocked = false; 
    let employees = [];

    // --- 同步逻辑 ---
    function pushToCloud() {
        if (!employees.length) return alert("没有数据可以上传 / No hay datos");
        fetch(FB_URL, { method: 'PUT', body: JSON.stringify(employees) })
        .then(res => { if(res.ok) alert("✅ 云端同步成功！电脑数据已上传。"); else alert("失败"); })
        .catch(err => alert("错误: " + err));
    }

    function pullFromCloud() {
        if(!confirm("确定下载覆盖本地吗？ / ¿Sincronizar desde la nube?")) return;
        fetch(FB_URL).then(res => res.json()).then(data => {
            if(data) {
                employees = data;
                saveData();
                render();
                alert("✅ 同步成功！已获取云端最新数据。");
            } else {
                alert("云端没有数据");
            }
        }).catch(err => alert("下载失败"));
    }

    // --- 核心逻辑 ---
    function loadData() {
        const d = localStorage.getItem(DB_NAME);
        if (d) { employees = JSON.parse(d); }
    }

    function saveData() {
        localStorage.setItem(DB_NAME, JSON.stringify(employees));
    }

    function openModal() {
        if (isUnlocked) { isUnlocked = false; updateLockUI(); render(); } 
        else { document.getElementById('passwordModal').style.display = 'flex'; }
    }

    function closeModal() { document.getElementById('passwordModal').style.display = 'none'; }

    function verifyPassword() {
        if (document.getElementById('adminPassInput').value === ADMIN_PASSWORD) {
            isUnlocked = true; updateLockUI(); closeModal(); render();
        } else { alert("密码错误"); }
    }

    function updateLockUI() {
        const s = document.getElementById('lockStatusDisplay');
        s.innerHTML = isUnlocked ? "🔓 管理模式" : "🔒 已锁定";
        s.className = isUnlocked ? "lock-status status-unlocked" : "lock-status status-locked";
    }

    function doPunch(empId, dayIdx, field) {
        const emp = employees.find(e => e.id === empId);
        if (!emp.records[dayIdx]) emp.records[dayIdx] = { s:'', e:'', off:false, abs:false, b:0 };
        if (!isUnlocked && emp.records[dayIdx][field]) return;
        const now = new Date();
        emp.records[dayIdx][field] = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        saveData(); render();
    }

    function addEmployee() {
        if (!isUnlocked) return alert("请先解锁管理员权限");
        const n = prompt("输入姓名:");
        if (n) {
            employees.push({ id: Date.now(), name: n, startDate: new Date().toISOString().split('T')[0], days: 15, dailyRate: 500, otRate: 60, records: {} });
            saveData(); render();
        }
    }

    function updateConfig(id, f, v) {
        if (!isUnlocked) return;
        const emp = employees.find(e => e.id === id);
        if (emp) { emp[f] = v; saveData(); render(); }
    }

    function updateState(empId, dayIdx, field, val) {
        const emp = employees.find(e => e.id === empId);
        if (!emp.records[dayIdx]) emp.records[dayIdx] = { s:'', e:'', off:false, abs:false, b:0 };
        emp.records[dayIdx][field] = val;
        saveData(); render();
    }

    function calculateHours(s, e) {
        if(!s || !e) return 0;
        let d1 = new Date(`2000-01-01T${s}`), d2 = new Date(`2000-01-01T${e}`);
        if (d2 < d1) d2.setDate(d2.getDate() + 1);
        return (d2 - d1) / 3600000;
    }

    function render() {
        const list = document.getElementById('employees-content');
        list.innerHTML = "";
        let gBase=0, gExtras=0, gBonos=0, gAll=0, summaryHtml = "";

        employees.forEach(emp => {
            const sDate = new Date(emp.startDate + "T00:00:00");
            let rowsHtml = "", eBase=0, eExtras=0, eBonos=0, dT=0, dL=0, dA=0;

            for(let d=0; d<emp.days; d++){
                const rec = emp.records[d] || { s:'', e:'', off:false, abs:false, b:0 };
                let wh=0, oh=0, pay=0, cur = new Date(sDate); cur.setDate(sDate.getDate() + d);
                
                if (rec.abs) { dA++; pay = parseFloat(rec.b || 0); } 
                else if (rec.off) { dL++; eBase += parseFloat(emp.dailyRate); pay = parseFloat(emp.dailyRate) + parseFloat(rec.b || 0); } 
                else {
                    dT++; eBase += parseFloat(emp.dailyRate);
                    if (rec.s && rec.e) { 
                        wh = calculateHours(rec.s, rec.e); 
                        oh = Math.max(0, wh - 9); 
                        eExtras += (oh * parseFloat(emp.otRate)); 
                    }
                    pay = parseFloat(emp.dailyRate) + (oh * parseFloat(emp.otRate)) + parseFloat(rec.b || 0);
                }
                eBonos += parseFloat(rec.b || 0);
                rowsHtml += `<tr><td>${cur.getMonth()+1}/${cur.getDate()}</td>
                    <td><input type="checkbox" ${rec.off?'checked':''} onchange="updateState(${emp.id},${d},'off',this.checked)"></td>
                    <td><input type="checkbox" ${rec.abs?'checked':''} onchange="updateState(${emp.id},${d},'abs',this.checked)"></td>
                    <td>${rec.s} <button class="btn-punch no-print" onclick="doPunch(${emp.id},${d},'s')">入</button></td>
                    <td>${rec.e} <button class="btn-punch no-print" onclick="doPunch(${emp.id},${d},'e')">出</button></td>
                    <td>${wh.toFixed(1)}</td><td>${oh.toFixed(1)}</td>
                    <td><input type="number" value="${rec.b}" style="width:40px" onchange="updateState(${emp.id},${d},'b',this.value)"></td>
                    <td>${pay.toFixed(2)}</td></tr>`;
            }
            const total = eBase + eExtras + eBonos;
            gBase+=eBase; gExtras+=eExtras; gBonos+=eBonos; gAll+=total;
            summaryHtml += `<tr><td>${emp.name}</td><td>${dT}/${dL}/${dA}</td><td>${eBase.toFixed(2)}</td><td>${eExtras.toFixed(2)}</td><td>${eBonos.toFixed(2)}</td><td>${total.toFixed(2)}</td></tr>`;
            
            list.innerHTML += `<div class="page-break">
                <h3 style="color:#1565c0;">${emp.name} - 明细</h3>
                <div class="individual-config no-print">
                    <div class="config-item">日期: <input type="date" value="${emp.startDate}" onchange="updateConfig(${emp.id},'startDate',this.value)"></div>
                    <div class="config-item">日薪: <input type="number" value="${emp.dailyRate}" onchange="updateConfig(${emp.id},'dailyRate',this.value)"></div>
                </div>
                <table><thead><tr><th>日期</th><th>休</th><th>缺</th><th>入</th><th>出</th><th>工时</th><th>加班</th><th>福利</th><th>小计</th></tr></thead>
                <tbody>${rowsHtml}</tbody></table>
                <div class="emp-stat-box"><b>合计: C$ ${total.toFixed(2)}</b></div>
            </div>`;
        });
        document.getElementById('summary-body').innerHTML = summaryHtml;
        document.getElementById('total-all').innerText = "C$ " + gAll.toFixed(2);
    }

    function clearAllData() { if (isUnlocked && confirm("确定清空？")) { employees = []; saveData(); render(); } }
    window.onload = () => { loadData(); render(); };
</script>
</body>
</html>
